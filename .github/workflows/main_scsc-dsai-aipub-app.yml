# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - ScSc-dsai-aipub-app

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: app-service-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Eleventy site
        run: npm run build

      - name: Remove development dependencies
        run: npm prune --omit=dev

      - name: Prepare deployment package
        shell: bash
        run: |
          mkdir -p deploy
          cp package.json package-lock.json server.js deploy/
          cp -r _site node_modules deploy/

      - name: Verify deployment package
        shell: bash
        run: |
          test -f deploy/_site/index.html
          test -f deploy/server.js
          test -f deploy/package.json
          test -f deploy/package-lock.json
          test -f deploy/node_modules/express/package.json

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: deploy/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: app-package
          path: deploy

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_8B3EE781F0B6422CAA7FFE179F4655CD }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_DCF956D421C8442F826D4D6433489211 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B03297B5B7CA42918BDEED6CFEDC942F }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'ScSc-dsai-aipub-app'
          package: ./deploy
