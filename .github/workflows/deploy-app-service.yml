name: Deploy to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: app-service-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install all dependencies
        run: npm ci

      - name: Build Eleventy site
        run: npm run build

      - name: Remove development dependencies
        run: npm prune --omit=dev

      - name: Prepare deployment package
        shell: bash
        run: |
          rm -rf deploy
          mkdir -p deploy
          cp package.json package-lock.json server.js deploy/
          cp -r _site node_modules deploy/

      - name: Verify deployment package
        shell: bash
        run: |
          test -f deploy/_site/index.html
          test -f deploy/server.js
          test -f deploy/package.json
          test -f deploy/package-lock.json
          test -f deploy/node_modules/express/package.json

      - name: Sign in to Azure with OpenID Connect
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: ./deploy
